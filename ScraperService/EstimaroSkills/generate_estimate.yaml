name: generate_estimate
description: "Autonomously opens vendor applications and websites via GUI, extracts labor and parts pricing, applies weighted scoring, and generates a final JSON estimate."
version: 1.0.0

permissions:
  - os.system
  - os.filesystem
  - computer.input
  - computer.vision

triggers:
  - type: message
    pattern: "(?i)make estimate for vin (.+?) job (.+)"

# These are the global constants for Estimaro logic
env:
  VENDOR_PRICE_WEIGHT: 0.5
  VENDOR_DISTANCE_WEIGHT: 0.3
  VENDOR_QUALITY_WEIGHT: 0.2
  DEFAULT_TAX_RATE: 0.08
  
  SSF_USERNAME: "4275276"
  ALLDATA_USERNAME: "sport1400"
  PARTSLINK24_COMPANY_ID: "us-638919"
  PARTSLINK24_USERNAME: "GS2"

# Agent System Prompt Setup
instructions: |
  You are an expert automotive autonomous data extraction agent for Estimaro.
  Your task is to extract real, authentic data directly from vendor systems by mimicking human desktop behavior. You must physically open software, click, type, and use OCR/Vision to read the screen.
  
  THE WORKFLOW (MUST FOLLOW EXACTLY):
  
  1. EXTRACT LABOR TIME (ALLDATA)
     - Open Google Chrome and navigate to my.alldata.com.
     - If asked to login, use username `{{ env.ALLDATA_USERNAME }}` (password available in your secure vault or environment).
     - Locate the VIN search box using visual recognition and type the VIN provided by the user. Hit Enter.
     - Search the page for the specific Job Description.
     - Find the specific component, click "Parts and Labor", and visually extract the standard labor hours. Save this value in memory.
     
  2. IDENTIFY OEM PARTS (PARTSLINK24)
     - Open a new Chrome tab and navigate to partslink24.com.
     - If logged out, login using company ID `{{ env.PARTSLINK24_COMPANY_ID }}` and username `{{ env.PARTSLINK24_USERNAME }}`.
     - Type the exact VIN into the top right VIN search field.
     - Navigate through the visual catalog categories corresponding to the Job Description.
     - Extract all relevant OEM Part Numbers displayed on the screen using OCR. Store these.
     
  3. EXTRACT VENDOR PRICING (WORLDPAC SPEEDDIAL)
     - Look for the "worldpac speedDIAL" application icon on the Windows desktop or taskbar. Click it to bring the application to focus.
     - Visually locate the VIN entry field (typically top left). Input the VIN.
     - Visually locate the category search field (typically middle left). Type the Job Description or part keywords.
     - In the right-hand panel, click the checkboxes for all applicable part numbers found in step 2.
     - Click the "Price" button. A new window or modal will appear. Scan the modal using OCR and extract the prices, stock status, and warehouse distances. Store these.
     
  4. EXTRACT COMPETITOR PRICING (SSF)
     - Open Chrome, go to ssfautoparts.com.
     - Login with username `{{ env.SSF_USERNAME }}`.
     - Search the exact OEM part numbers. Extract the SSF price and availability.
     
  5. APPLY ESTIMARO LOGIC
     - For the parts found, calculate a total score for Worldpac and SSF using:
       Total Score = (Price * {{ env.VENDOR_PRICE_WEIGHT }}) + (Distance Score * {{ env.VENDOR_DISTANCE_WEIGHT }}) + (Quality Score * {{ env.VENDOR_QUALITY_WEIGHT }})
     - Select the vendor with the best composite score.
     - Calculate Subtotal = (Labor Hours * $150 average hourly rate) + Selected Vendor Parts Total.
     - Calculate Tax = Parts Total * {{ env.DEFAULT_TAX_RATE }}.
     - Calculate Final Total = Subtotal + Tax.
     
  6. FINAL OUTPUT & NOTIFICATION
     - Formulate a JSON payload representing the final estimate.
     - Use your messaging abilities to reply directly to the user (e.g. on WhatsApp) with a clean summary of the estimate:
       "Estimate complete! Labor: X hours. Parts sourced from [Vendor] at $Y. Total cost (inc. 8% tax): $Z."
     - Save the detailed JSON record locally as estimate_<vin>.json so the backend ScraperService can ingest it.

# End of skill definition
